name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # required for softprops/action-gh-release to publish

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (M1)
    steps:
      - uses: actions/checkout@v4

      - name: Build (Release)
        run: swift build -c release

      - name: Assemble .app bundle
        run: |
          mkdir -p Znote.app/Contents/MacOS
          mkdir -p Znote.app/Contents/Resources
          cp .build/release/Znote Znote.app/Contents/MacOS/Znote
          cp Sources/Znote/Resources/Info.plist Znote.app/Contents/Info.plist
          cp Sources/Znote/Resources/Znote.icns Znote.app/Contents/Resources/Znote.icns

      - name: Import Developer ID certificate
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Sign .app
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          if [ -n "$SIGNING_IDENTITY" ]; then
            echo "Signing with Developer ID: $SIGNING_IDENTITY"
            codesign --force --deep \
              --options runtime \
              --sign "$SIGNING_IDENTITY" \
              --entitlements Sources/Znote/Resources/Znote.entitlements \
              Znote.app
            codesign --verify --verbose=2 Znote.app
          else
            echo "⚠ No signing identity secret set — falling back to ad-hoc signing"
            codesign --force --deep --sign - Znote.app
          fi

      - name: Notarize .app
        if: ${{ env.NOTARY_APPLE_ID != '' }}
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          ditto -c -k --keepParent Znote.app Znote-notarize.zip
          xcrun notarytool submit Znote-notarize.zip \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple Znote.app
          rm Znote-notarize.zip

      - name: Zip app
        run: ditto -c -k --keepParent Znote.app Znote.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Znote.app
          path: Znote.zip

      # Only publish to GitHub Release when the repo has the Developer ID
      # signing secret configured. Without it, the .app is ad-hoc signed and
      # would be rejected by Gatekeeper — better to skip than ship broken.
      # For unsigned-secrets setups: build locally with ./package.sh + ./dmg.sh
      # and upload to the release manually.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNING_IDENTITY != ''
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        uses: softprops/action-gh-release@v2
        with:
          files: Znote.zip
          body: |
            ## Install

            1. Download `Znote.zip` and extract
            2. Move `Znote.app` to `/Applications/`
            3. If macOS complains about quarantine: `xattr -cr /Applications/Znote.app`
            4. Grant permissions (Accessibility + Input Monitoring + Microphone) in System Settings
            5. Launch from Spotlight or `/Applications/Znote.app`

            **Requires:** Apple Silicon Mac, macOS 14+

      - name: Note when Release publish was skipped
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNING_IDENTITY == ''
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          echo "::notice::SIGNING_IDENTITY secret not set — skipped publishing to GitHub Release."
          echo "::notice::Build local signed+notarized artifacts with ./package.sh && ./dmg.sh, then upload manually to the tag."
