name: Deploy GitHub Pages

# Deploys the static landing page in site/ to GitHub Pages whenever:
#   - site/ files change on main
#   - someone clicks "Run workflow" in the Actions tab
#
# Requires Settings → Pages → Source: "GitHub Actions" (one-time).
# Site URL: https://nicetooo.github.io/Znote/

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; cancel queued duplicates.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
        with:
          # Auto-enable Pages on the repo if it isn't already (otherwise the
          # action fails with "HttpError: Not Found").
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
